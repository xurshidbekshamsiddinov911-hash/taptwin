<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#211a31">
<title>TapTwin</title>
<style>
:root{--bg:#211a31;--panel:#302642;--line:#493958;--gold:#ffd982;--gold2:#f4b94e;--text:#fff8ee;--muted:#c9bfd6}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:radial-gradient(ellipse at 5% 30%,#8a6c39 0,transparent 28%),radial-gradient(ellipse at 100% 78%,#50315e 0,transparent 38%),linear-gradient(155deg,#30253f,#211a31 55%,#2b2039);touch-action:manipulation}
.app{height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;padding:12px 15px 10px;gap:10px}
.brandbar{height:45px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{font-size:25px;font-weight:800;letter-spacing:-.7px}.verified{color:#63c6ff;font-size:17px}
.demo{border:1px solid #514365;background:#392b4c;padding:7px 12px;border-radius:13px;font-size:12px;color:#f5e8ff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#352a45;border:1px solid #4a3b5b;border-radius:14px;padding:10px 3px;flex-shrink:0}
.stat{text-align:center;font-size:13px;font-weight:750;border-right:1px solid #51425f;white-space:nowrap}.stat:last-child{border:0}.ico{font-size:17px;margin-right:4px}
.quick{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;flex-shrink:0}
.pill{min-height:48px;border:1px solid #4a3b5b;background:#332840;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;font-size:14px}
.pill strong{font-weight:700}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 0 4px}
.coin-zone{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.coin{width:min(76vw,330px,43vh);aspect-ratio:1;border-radius:50%;position:relative;border:0;cursor:pointer;background:radial-gradient(circle at 34% 25%,#fff2bb 0,#ffe19a 23%,#f8c45f 49%,#d99036 72%,#9c5c22 100%);box-shadow:inset 0 0 0 5px #e5b85e,inset 0 0 0 9px #fff0b2,inset 0 0 0 13px #c58b3d,inset 0 0 0 17px #ffe9a0,0 12px 0 #71431f,0 18px 24px #08051188;transform:rotate(-7deg);-webkit-tap-highlight-color:transparent;transition:transform .08s}
.coin:before{content:"";position:absolute;inset:7%;border-radius:50%;border:2px solid #e8b75e;box-shadow:inset 0 0 0 3px #fff0b0,inset 0 0 0 6px #e0a54a}
.coin:after{content:"";position:absolute;inset:13%;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff0b8,#ffd77b 42%,#e8a943 85%);border:2px solid #fff0b2;box-shadow:inset 0 3px 7px #a65f1b55}
.coin:active{transform:rotate(-7deg) scale(.96);box-shadow:inset 0 0 0 5px #e5b85e,inset 0 0 0 9px #fff0b2,inset 0 0 0 13px #c58b3d,inset 0 0 0 17px #ffe9a0,0 5px 0 #71431f,0 8px 12px #08051188}
.coinword{position:absolute;z-index:2;inset:0;display:flex;align-items:center;justify-content:center;color:#a66a27;font-size:clamp(30px,9vw,47px);font-weight:900;letter-spacing:-2px;text-shadow:0 2px #fff3b4,0 -1px #9d5b1c;transform:rotate(7deg)}
.ringtext{position:absolute;z-index:2;top:14%;left:0;width:100%;text-align:center;font-size:clamp(7px,2vw,10px);letter-spacing:1.5px;color:#a97837;font-weight:800}
.energyrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;padding:3px 5px 8px}
.energy{font-size:20px;font-weight:800;letter-spacing:.2px}.energy small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}
.boost{background:#392d4b;border:1px solid #514162;border-radius:12px;padding:13px 16px;font-size:14px;color:white}
.bottomnav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:10px 7px 6px;background:#302540;border:1px solid #443450;border-radius:19px;flex-shrink:0}
.navbtn{border:1px solid #493a58;background:#372b47;color:#fff5e8;border-radius:11px;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;cursor:pointer}
.navbtn .emoji{font-size:23px}.navbtn.active{border-color:#e8b75e;background:#45354b;box-shadow:inset 0 0 0 1px #e8b75e}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#3c2c4e;border:1px solid #f6cf7c;border-radius:13px;padding:10px 16px;font-weight:700;z-index:9;display:none;box-shadow:0 8px 25px #0006;max-width:90%;text-align:center}
.sheet{position:fixed;inset:0;background:#100b18b8;display:none;align-items:flex-end;z-index:8}.sheetbox{width:100%;max-width:560px;margin:auto;background:#302540;border:1px solid #584364;border-radius:22px 22px 0 0;padding:20px 18px 30px;max-height:70vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:800;margin-bottom:14px}.close{border:0;background:#493858;color:white;border-radius:9px;padding:6px 12px;font-size:18px}.sheetcontent{color:#e7deee;font-size:14px;line-height:1.6}
@media(min-height:850px){.app{gap:12px}.coin{width:min(76vw,360px,45vh)}}
</style>
</head>
<body>
<div class="app">
  <header class="brandbar"><div class="brand">👑 TapTwin <span class="verified">●</span></div><div class="demo">✨ DEMO</div></header>
  <section class="stats">
    <div class="stat"><span class="ico">🪙</span><span id="miniCoins">0</span></div>
    <div class="stat"><span class="ico">🎟️</span><span id="tickets">0</span></div>
    <div class="stat"><span class="ico">💵</span><span id="gems">0</span></div>
    <div class="stat"><span class="ico">🤖</span><span id="bots">0</span></div>
  </section>
  <section class="quick">
    <button class="pill" id="rankBtn"><span>🏆</span><strong id="rankMini">Beginner</strong><span>›</span></button>
    <button class="pill" id="walletBtn"><span>👛</span><strong>Connect Wallet</strong><span>›</span></button>
  </section>
  <main>
    <div class="coin-zone">
      <button class="coin" id="tapCoin" aria-label="Tap to earn coins"><span class="ringtext">TAPTWIN • COMMUNITY • TAPTWIN</span><span class="coinword">Twin</span></button>
    </div>
    <div class="energyrow">
      <div class="energy">⚡ <span id="energy">500</span>/<span id="energyMax">500</span><small>Energy restores over time</small></div>
      <button class="boost" id="boostBtn">🔥 Boost</button>
    </div>
  </main>
  <nav class="bottomnav">
    <button class="navbtn active" data-page="Earn"><span class="emoji">🪙</span>Earn</button>
    <button class="navbtn" data-page="Tasks"><span class="emoji">☑️</span>Tasks</button>
    <button class="navbtn" data-page="Account"><span class="emoji">😎</span>Account</button>
    <button class="navbtn" data-page="Skills"><span class="emoji">🤖</span>Skills</button>
    <button class="navbtn" data-page="Cashier"><span class="emoji">💰</span>Cashier</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="sheetbox"><div class="sheethead"><span id="sheetTitle">TapTwin</span><button class="close" id="closeSheet">✕</button></div><div class="sheetcontent" id="sheetContent"></div></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const ranks=[{name:"Beginner",min:0,icon:"🪙"},{name:"Rookie",min:1000,icon:"🌟"},{name:"Rising Star",min:10000,icon:"💫"},{name:"Pro",min:100000,icon:"💎"},{name:"Elite",min:500000,icon:"🏆"},{name:"Legend",min:1000000,icon:"👑"}];
let coins=Number(localStorage.getItem("taptwin_coins")||0);
let energy=Number(localStorage.getItem("taptwin_energy")||500);
let energyMax=500, last=Date.now(), boostUntil=Number(localStorage.getItem("taptwin_boost")||0);
function rankIndex(){let i=0;for(let j=0;j<ranks.length;j++)if(coins>=ranks[j].min)i=j;return i}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";clearTimeout(toast.timer);toast.timer=setTimeout(()=>$("toast").style.display="none",2100)}
function save(){localStorage.setItem("taptwin_coins",coins);localStorage.setItem("taptwin_energy",energy);localStorage.setItem("taptwin_boost",boostUntil)}
function render(){let i=rankIndex();$("miniCoins").textContent=coins.toLocaleString();$("energy").textContent=Math.floor(energy);$("rankMini").textContent=ranks[i].name;save()}
$("tapCoin").addEventListener("click",()=>{if(energy<1){toast("⚡ Energy tugadi, tiklanishini kuting!");return}let old=rankIndex();coins+=Date.now()<boostUntil?2:1;energy=Math.max(0,energy-1);render();if(rankIndex()>old)toast("🎉 Yangi rank: "+ranks[rankIndex()].name+"!");});
setInterval(()=>{let now=Date.now();energy=Math.min(energyMax,energy+(now-last)/1000*2);last=now;render()},1000);
$("boostBtn").onclick=()=>{if(Date.now()<boostUntil){toast("🔥 Boost faol!");return}if(coins<250){toast("Boost uchun 250 coin kerak");return}coins-=250;boostUntil=Date.now()+5*60*1000;render();toast("🔥 5 daqiqalik 2x Boost yoqildi!");};
function show(title,content){$("sheetTitle").textContent=title;$("sheetContent").innerHTML=content;$("sheet").style.display="flex"}
$("closeSheet").onclick=()=>$("sheet").style.display="none";
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))$("sheet").style.display="none"});
$("rankBtn").onclick=()=>{let i=rankIndex(),next=ranks[i+1];show("🏆 TapTwin Ranks",ranks.map((r,j)=>`<p>${r.icon} <b>${r.name}</b> — ${r.min.toLocaleString()} coins ${j===i?"<b>• CURRENT</b>":""}</p>`).join("")+(next?`<p>Keyingi rank: <b>${next.name}</b><br>Yana ${(next.min-coins).toLocaleString()} coin kerak.</p>`:"<p>👑 Eng yuqori rankga yetdingiz!</p>"))};
$("walletBtn").onclick=()=>show("👛 Wallet","Bu demo versiyada kripto hamyon ulanmagan. Haqiqiy wallet ulash uchun alohida xavfsiz backend va wallet integratsiyasi kerak.");
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");let p=b.dataset.page;if(p==="Earn")return;if(p==="Tasks")show("☑️ Tasks","<p>Kunlik topshiriqlar keyingi bosqichda qo‘shiladi.</p><p>Hozircha bu demo sahifa — obuna tekshiruvi va mukofotlar server talab qiladi.</p>");else if(p==="Account")show("😎 Account",`<p>Balans: <b>${coins.toLocaleString()} coins</b></p><p>Rank: <b>${ranks[rankIndex()].name}</b></p><p>Balans hozircha faqat shu qurilmada saqlanadi.</p>`);else if(p==="Skills")show("🤖 Skills","<p>Upgrade funksiyasi keyingi bosqichda qo‘shiladi.</p>");else show("💰 Cashier","<p>Demo coinlar haqiqiy pul emas va yechib olinmaydi.</p>")});
render();
})();
</script>
</body>
</html>
