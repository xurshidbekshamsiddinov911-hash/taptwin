<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TapTwin</title>
<style>
:root{color-scheme:dark;--bg:#11131b;--panel:#1c2030;--gold:#ffd45b;--muted:#9ca4ba}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 35%,#292846 0,#151722 45%,#0d0f16 100%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{max-width:460px;margin:auto;padding:20px 18px 26px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.5px}
.logo{font-size:22px}.badge{font-size:12px;color:var(--gold);border:1px solid #5c4c26;border-radius:20px;padding:7px 10px}
.balance{text-align:center;margin-top:42px}.label{font-size:13px;color:var(--muted);letter-spacing:2px;font-weight:700}.amount{font-size:42px;font-weight:900;margin-top:5px;font-variant-numeric:tabular-nums}
.coin-wrap{display:flex;justify-content:center;align-items:center;flex:1;min-height:255px}
.coin{width:min(62vw,245px);height:min(62vw,245px);border-radius:50%;border:8px solid #e7a92c;background:radial-gradient(circle at 35% 25%,#fff1a4 0,#ffd75b 24%,#f2a920 62%,#bd6b0b 100%);box-shadow:0 0 0 9px #ffd34b22,0 15px 35px #0008,inset 0 5px 12px #fff9,inset 0 -9px 15px #8d4b14;display:grid;place-items:center;color:#7b4307;font-size:86px;font-weight:1000;text-shadow:0 2px 0 #fff7;user-select:none;touch-action:manipulation;transition:transform .08s}
.coin:active{transform:scale(.94)}.coin small{font-size:16px;display:block;text-align:center;letter-spacing:3px;margin-top:-16px}
.energy-card{background:#1b1e2b;border:1px solid #303448;border-radius:18px;padding:15px;margin-bottom:16px}
.energy-row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:9px}.energy-row span:last-child{color:var(--muted)}
.bar{height:8px;background:#33384b;border-radius:20px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#8d7bff,#c2b9ff);transition:width .15s}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.navbtn{background:#1b1e2b;border:1px solid #303448;color:#dce0ef;padding:12px 5px;border-radius:13px;font-weight:700;font-size:12px}
.note{text-align:center;color:#7f879e;font-size:11px;margin-top:16px;line-height:1.4}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#272b3b;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
</style>
</head>
<body><main class="app">
<header><div class="logo">🪙 TapTwin</div><div class="badge">DEMO • v1</div></header>
<section class="balance"><div class="label">YOUR BALANCE</div><div class="amount" id="balance">0</div></section>
<div class="coin-wrap"><button class="coin" id="tap" aria-label="Tap coin">T<small>TAP</small></button></div>
<section class="energy-card"><div class="energy-row"><span>⚡ ENERGY</span><span id="energyText">500 / 500</span></div><div class="bar"><div class="fill" id="energyFill"></div></div></section>
<nav><button class="navbtn" id="daily">🎁 Daily bonus</button><button class="navbtn" id="upgrade">🚀 Upgrade: Lv. 1</button><button class="navbtn" id="reset">↻ Reset demo</button></nav>
<div class="note">Demo prototype: coins are game points only, not real money.<br>Progress is saved on this device only.</div>
</main><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let state={balance:0,energy:500,level:1,lastBonus:0};
try{state={...state,...JSON.parse(localStorage.getItem('taptwin-demo')||'{}')}}catch(e){}
function save(){localStorage.setItem('taptwin-demo',JSON.stringify(state));render()}
function render(){$('balance').textContent=state.balance.toLocaleString();$('energyText').textContent=`${state.energy} / 500`;$('energyFill').style.width=(state.energy/500*100)+'%';$('upgrade').textContent=`🚀 Upgrade: Lv. ${state.level}`}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}
$('tap').addEventListener('click',()=>{if(state.energy<1){toast('Energy is empty — wait a little!');return}state.balance+=state.level;state.energy--;save()});
$('daily').addEventListener('click',()=>{const now=Date.now();if(now-state.lastBonus<86400000){toast('Daily bonus already claimed!');return}state.balance+=100;state.lastBonus=now;save();toast('+100 demo coins!')});
$('upgrade').addEventListener('click',()=>{const cost=state.level*100;if(state.balance<cost){toast(`Need ${cost} coins to upgrade`);return}state.balance-=cost;state.level++;save();toast('Upgrade successful!')});
$('reset').addEventListener('click',()=>{if(confirm('Reset all demo progress on this device?')){state={balance:0,energy:500,level:1,lastBonus:0};save();toast('Demo reset')}})
setInterval(()=>{if(state.energy<500){state.energy=Math.min(500,state.energy+1);save()}},1200);
render();
</script></body></html>
